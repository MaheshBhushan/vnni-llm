[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnni-llm-mcp"
version = "0.1.0"
description = "Bounded MCP generation using the vnni-llm C++ engine"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[project.scripts]
vnni-mcp = "vnni_mcp:main"

[tool.setuptools]
py-modules = ["vnni_mcp"]
